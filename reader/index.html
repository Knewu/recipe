<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>txt리더기</title>
<meta name="description" content="내 txt 파일을 한 장씩 넘기며 읽는 이북 리더">
<meta name="theme-color" content="#FAFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="txt리더기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
:root{
  --paper:#FAFAF7;--ink:#1C2024;--ink-2:#5B626A;--ink-3:#969CA3;--line:#E2E3DE;--wash:#EEEFEA;--raise:#FFFFFF;
  --accent:#2F4F96;--accent-ink:#FFFFFF;--accent-wash:#E5EAF5;--spine:rgba(20,26,36,.05);
  --scrim:rgba(16,20,28,.34);--shadow:0 16px 48px rgba(16,22,34,.18);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-batang:"Gowun Batang","AppleMyungjo","Batang","Noto Serif KR",serif;
  --f-myeongjo:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-gothic:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs:18px;--lh:1.8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--paper:#141619;--ink:#D4D7DA;--ink-2:#979DA4;--ink-3:#60666D;--line:#2A2E34;--wash:#1F2226;--raise:#1B1E22;--accent:#93AAE6;--accent-ink:#10141F;--accent-wash:#222B41;--spine:rgba(255,255,255,.045);--scrim:rgba(0,0,0,.52);--shadow:0 16px 48px rgba(0,0,0,.55)}
}
:root[data-theme="dark"]{color-scheme:dark;--paper:#141619;--ink:#D4D7DA;--ink-2:#979DA4;--ink-3:#60666D;--line:#2A2E34;--wash:#1F2226;--raise:#1B1E22;--accent:#93AAE6;--accent-ink:#10141F;--accent-wash:#222B41;--spine:rgba(255,255,255,.045);--scrim:rgba(0,0,0,.52);--shadow:0 16px 48px rgba(0,0,0,.55)}

/* 읽기 배경: 앱 테마와 별개로 고르는 종이 */
.reader[data-paper="white"]{color-scheme:light;--paper:#FFFFFF;--ink:#17191B;--ink-2:#5D6268;--ink-3:#9DA1A6;--line:#E6E6E3;--wash:#F0F0EE;--accent:#2F4F96;--accent-ink:#FFFFFF;--spine:rgba(0,0,0,.06)}
.reader[data-paper="ivory"]{color-scheme:light;--paper:#F3EBDC;--ink:#30271E;--ink-2:#77695A;--ink-3:#A89B8A;--line:#E0D5C1;--wash:#EADFCB;--accent:#2F4F96;--accent-ink:#FFFFFF;--spine:rgba(80,50,20,.09)}
.reader[data-paper="night"]{color-scheme:dark;--paper:#0E1012;--ink:#B7BBBF;--ink-2:#7B8187;--ink-3:#50565C;--line:#23272B;--wash:#1A1D20;--accent:#8EA4DC;--accent-ink:#0E1220;--spine:rgba(255,255,255,.035)}

html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ── 리더 ── */
.reader{--top-gap:0px;position:relative;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
.stage{position:absolute;inset:0;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.runhead{position:absolute;top:var(--top-gap);left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.runhead span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:500 12px/1 var(--f-ui);letter-spacing:.06em;color:var(--ink-3)}
.viewport{position:absolute;overflow:hidden}
.flow{height:100%;column-fill:auto;font-size:var(--fs);line-height:var(--lh);color:var(--ink);font-family:var(--f-batang);transition:transform .34s cubic-bezier(.22,.7,.2,1);will-change:transform;font-kerning:normal}
.flow p{margin:0;text-indent:1em;text-align:justify;orphans:2;widows:2}
.flow p.sp{margin-top:.8em}
.flow p.c{text-indent:0}
.flow h2{margin:0 0 1.5em;padding-top:1.4em;font-size:1.32em;line-height:1.4;font-weight:700;text-wrap:balance;letter-spacing:-.01em;break-after:avoid}
.flow h2::after{content:"";display:block;width:1.6em;height:2px;margin-top:.7em;background:var(--accent)}
.tp{height:var(--col-h);display:flex;flex-direction:column;justify-content:center;gap:.9rem;padding-bottom:14%;break-inside:avoid}
.tp h1{margin:0;font-size:1.95em;line-height:1.3;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.tp .rule{display:block;width:2.4em;height:2px;background:var(--accent)}
.tp .meta{font:500 13px/1.7 var(--f-ui);color:var(--ink-2);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.spine{position:absolute;width:40px;margin-left:-20px;background:linear-gradient(90deg,transparent,var(--spine) 50%,transparent);pointer-events:none}
.ribbon{position:absolute;top:var(--top-gap);width:20px;height:54px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);pointer-events:none;animation:drop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-100%)}}
.folio{position:absolute;left:0;right:0;bottom:0;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none;font:500 12px/1 var(--f-ui);color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.folio-pct{text-align:right}

/* 위아래 메뉴 */
.bar{position:absolute;left:0;right:0;z-index:5;background:var(--paper);background:color-mix(in srgb,var(--paper) 93%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .24s cubic-bezier(.2,.7,.2,1),opacity .2s}
.bar.top{top:0;height:calc(54px + var(--top-gap));padding-top:var(--top-gap);display:flex;align-items:center;gap:2px;padding-inline:8px;border-bottom:1px solid var(--line)}
.bar.bottom{bottom:0;padding:8px 10px 10px;border-top:1px solid var(--line)}
.reader:not(.chrome) .bar.top{transform:translateY(-100%);opacity:0;pointer-events:none}
.reader:not(.chrome) .bar.bottom{transform:translateY(100%);opacity:0;pointer-events:none}
.bar-title{flex:1;min-width:0;text-align:center;font:600 14px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:6px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 9px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:500 14px var(--f-ui);cursor:pointer}
.ib:hover{background:var(--wash)}
.ib[aria-pressed="true"]{color:var(--accent)}
.ib[aria-pressed="true"] path{fill:currentColor}
.ib .gaga{font-family:var(--f-batang);font-weight:700;letter-spacing:-.02em;line-height:1}
.ib .gaga small{font-size:12px}
.ib .gaga b{font-size:18px}
.scrub-row{display:flex;align-items:center;gap:4px;max-width:760px;margin-inline:auto}
.scrub-wrap{position:relative;flex:1;height:32px}
.ticks{position:absolute;left:9px;right:9px;top:50%;height:12px;margin-top:-6px;pointer-events:none}
.ticks i{position:absolute;top:0;width:1px;height:12px;background:var(--ink-3);opacity:.55}
.scrub{position:relative;-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent;cursor:pointer}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--accent)}
.scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.scrub::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--accent)}
.info{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding-inline:50px;font:500 12.5px/1.4 var(--f-ui);color:var(--ink-2)}
.info-ch{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.info-pct{flex:none;font-variant-numeric:tabular-nums}
.info.preview .info-ch,.info.preview .info-pct{color:var(--accent)}

/* ── 패널 공통 ── */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.clear{background:transparent}
.drawer{position:fixed;top:0;bottom:0;z-index:30;width:min(410px,100%);display:flex;flex-direction:column;background:var(--raise);color:var(--ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s linear .28s}
.drawer.left{left:0;transform:translateX(-102%)}
.drawer.right{right:0;transform:translateX(102%)}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--raise);color:var(--ink);font:500 14px var(--f-ui);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:#B3261E;border-color:currentColor}
.grow{flex:1}

/* 서재 */
.lib-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 12px 10px 20px}
.lib-title{margin:0;font:700 30px/1.15 var(--f-batang);letter-spacing:-.02em}
.lib-sub{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.lib-actions{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px 0}
.lib-hint{margin:10px 20px 6px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.paste{display:grid;gap:6px;margin:12px 20px 4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.fld-label{font:600 12px var(--f-ui);color:var(--ink-2);letter-spacing:.02em}
.paste input,.paste textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink);font:15px/1.6 var(--f-ui);padding:9px 11px}
.paste textarea{resize:vertical;min-height:120px;font-family:var(--f-batang)}
.paste-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.books{list-style:none;margin:6px 0 0;padding:0 10px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.book-row{position:relative}
.book{display:flex;gap:12px;width:100%;padding:12px 46px 12px 10px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left;cursor:pointer}
.book:hover{background:var(--wash)}
.book[aria-current="true"]{background:var(--accent-wash)}
.book-spine{flex:none;width:9px;height:52px;margin-top:2px;border-radius:2px;background:hsl(var(--h) 32% 50%);box-shadow:inset -2px 0 0 rgba(0,0,0,.14)}
.book-main{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.book-title{font:700 16.5px/1.35 var(--f-batang);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.book-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag{font:600 10.5px/1 var(--f-ui);padding:4px 6px;border-radius:4px;background:var(--wash);color:var(--ink-2);letter-spacing:.02em}
.tag.now{background:var(--accent);color:var(--accent-ink)}
.book-prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.book-prog .track{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.book-prog .track i{display:block;height:100%;background:var(--accent)}
.del{position:absolute;top:12px;right:6px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--ink-3);cursor:pointer}
.del:hover{background:var(--wash);color:var(--ink)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 10px 12px 31px;font-size:13px;color:var(--ink-2)}
.confirm .btn{height:32px;padding:0 11px;font-size:13px}
.lib-note{margin:0;padding:12px 20px 14px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--ink-2)}

/* 목차·책갈피 */
.tabs{display:flex;align-items:center;gap:4px;padding:12px 10px 10px 12px;border-bottom:1px solid var(--line)}
.tab{height:38px;padding:0 13px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font:600 14.5px var(--f-ui);cursor:pointer}
.tab[aria-selected="true"]{background:var(--wash);color:var(--ink)}
.tab .n{margin-left:5px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:8px 8px 20px;overflow:auto;flex:1}
.item{position:relative;display:flex;align-items:baseline;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:9px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.item:hover{background:var(--wash)}
.item-t{flex:1;min-width:0;font:500 15.5px/1.45 var(--f-batang);overflow-wrap:anywhere}
.item-p{flex:none;font:500 12px var(--f-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.item[aria-current="true"] .item-t{color:var(--accent);font-weight:700}
.item[aria-current="true"]::before{content:"";position:absolute;left:2px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--accent)}
.item.first .item-t{font-family:var(--f-ui);font-size:14px;color:var(--ink-2)}
.mark{display:flex;align-items:flex-start;gap:4px}
.mark .item{flex-direction:column;gap:5px}
.mark .item-t{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mark .del{position:static;flex:none;margin-top:8px}
.empty{padding:28px 18px;color:var(--ink-2);font-size:14px;line-height:1.75}

/* 보기 설정 */
.sheet{position:fixed;left:50%;bottom:0;z-index:30;width:min(540px,100%);max-height:88%;overflow:auto;display:grid;gap:16px;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));background:var(--raise);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:var(--shadow);transform:translate(-50%,102%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s linear .28s}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font:600 16px var(--f-ui)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.set-label{font:500 13.5px var(--f-ui);color:var(--ink-2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--wash)}
.seg button{height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font:500 14px var(--f-ui);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:11px;background:var(--wash)}
.stepper button{width:44px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-family:var(--f-batang);font-weight:700;cursor:pointer;line-height:1}
.stepper button:hover{background:var(--raise)}
.stepper output{min-width:3.2ch;text-align:center;font:600 14px var(--f-ui);font-variant-numeric:tabular-nums}
.papers{display:flex;gap:12px;flex-wrap:wrap}
.papers button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:2px;color:var(--ink-2);font:500 12px var(--f-ui);cursor:pointer}
.papers .sw{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font:700 16px var(--f-batang)}
.papers button[aria-pressed="true"]{color:var(--ink)}
.papers button[aria-pressed="true"] .sw{outline:2px solid var(--accent);outline-offset:2px}
.sw-auto{background:linear-gradient(135deg,#FAFAF7 50%,#141619 50%)}
.sw-white{background:#FFFFFF;color:#17191B}
.sw-ivory{background:#F3EBDC;color:#30271E}
.sw-night{background:#0E1012;color:#B7BBBF}
.switch{position:relative;flex:none;width:46px;height:28px;border:0;border-radius:14px;background:var(--line);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.dropzone{position:fixed;inset:12px;z-index:60;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:18px;background:var(--accent-wash);background:color-mix(in srgb,var(--accent-wash) 94%,transparent);color:var(--accent);font:700 22px/1.4 var(--f-batang);text-align:center;padding:24px;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:70;max-width:calc(100% - 32px);transform:translate(-50%,10px);opacity:0;padding:10px 15px;border-radius:9px;background:var(--ink);color:var(--paper);font:500 13.5px/1.5 var(--f-ui);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){.ib .lbl{display:none}.info{padding-inline:46px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}}

/* 앱 버전: 홈 화면 실행 시 상태바·홈 표시줄 영역 */
[hidden]{display:none!important}
html{background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:14px;overscroll-behavior:none}
</style>
</head>
<body>
<div class="reader chrome" id="reader">
  <main class="stage" id="stage" aria-label="책 본문. 오른쪽을 누르면 다음 쪽, 왼쪽을 누르면 앞쪽">
    <div class="runhead"><span id="runhead"></span></div>
    <div class="viewport" id="viewport"><div class="flow" id="flow" lang="ko"></div></div>
    <div class="spine" id="spine" hidden></div>
    <div class="ribbon" id="ribbon" hidden></div>
    <div class="folio" id="folio"><span></span><span id="folioPage"></span><span class="folio-pct" id="folioPct"></span></div>
  </main>

  <header class="bar top" id="topBar">
    <button class="ib" id="libBtn" type="button" aria-label="서재 열기">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="4" width="4.2" height="16" rx=".6"/><rect x="9.2" y="4" width="4.2" height="16" rx=".6"/><path d="M15.2 5.4l3.7-1 3.4 14.5-3.7 1z"/></svg>
      <span class="lbl">서재</span>
    </button>

/* ───────── 예시 책 ───────── */
const GUIDE_ID = 'guide';
const GUIDE_TITLE = 'txt리더기 사용 안내서';
const GUIDE_TEXT = `이 책은 txt리더기를 처음 열면 보이는 안내서예요. 내 파일을 넣기 전에 한번 넘겨 보면서 손에 익혀 보세요. 화면 오른쪽을 누르면 다음 쪽으로 넘어가요.

제1장 책 넣기

왼쪽 위 서재 버튼을 누르면 서재가 열려요. '파일 열기'를 누르고 휴대폰이나 컴퓨터에 있는 파일을 고르면 바로 책이 돼요. txt뿐 아니라 워드(docx), 한글(hwp, hwpx), PDF도 넣을 수 있어요. 여러 개를 한꺼번에 골라도 되고, 컴퓨터라면 파일을 화면 위로 끌어다 놓기만 해도 서재에 들어가요.

워드, 한글, PDF는 글자만 뽑아서 책으로 만들어요. 표는 칸마다 한 줄씩 풀려 나오고, 그림과 글자 색은 빠져요. 워드에서 '제목 1' 같은 제목 스타일을 쓴 줄은 목차에 들어가요. PDF는 쪽마다 되풀이되는 머리글과 쪽 번호를 걸러내고 줄을 문단으로 다시 이어 붙이는데, 문서에 따라 문단이 조금 어긋날 수 있어요. 스캔한 이미지 PDF, 암호가 걸린 파일, 배포용으로 저장한 한글 파일은 읽을 수 없어요.

오래된 한글 txt 파일은 EUC-KR 방식으로 저장된 경우가 많아서 다른 프로그램에서 열면 글자가 깨지곤 해요. txt리더기는 먼저 UTF-8로 읽어 보고, 맞지 않으면 EUC-KR로 다시 읽어요. 따로 고를 건 없어요.

파일이 아니라 어딘가에서 복사한 글이라면 '글 붙여넣기'를 누르세요. 컴퓨터에서는 읽는 화면에서 그냥 Ctrl+V를 눌러도 붙여넣기 칸이 열려요. 제목 칸을 비워 두면 첫 줄을 제목으로 써요.

넣은 책은 지금 쓰는 브라우저 안에만 저장돼요. 어디로 올라가지 않으니 다른 사람이 볼 일은 없어요. 대신 다른 기기에서는 보이지 않고, 브라우저의 사이트 데이터를 지우면 책도 같이 지워져요. 원본 파일은 따로 잘 보관해 두세요.

제2장 장 넘기기

화면 오른쪽 3분의 1을 누르면 다음 쪽, 왼쪽 3분의 1을 누르면 앞쪽으로 가요. 손가락으로 옆으로 밀어도 되고, 컴퓨터에서는 방향키, 스페이스바, PageDown 키, 마우스 휠이 다 돼요.

가운데를 누르면 위아래 메뉴가 나타나요. 다시 누르거나 쪽을 넘기면 사라지고, 읽는 동안에는 장 제목과 쪽 번호만 작게 남아요.

아래 진행 막대를 끌면 책 전체에서 원하는 곳으로 바로 갈 수 있어요. 끄는 동안 어느 장, 몇 퍼센트인지 미리 보여 주고, 막대 위의 작은 눈금이 각 장이 시작하는 자리예요.

화면이 넓으면 종이책을 펼친 것처럼 두 쪽씩 보여 줘요. 한 쪽씩만 보고 싶으면 설정에서 두 쪽 보기를 끄면 돼요.

제3장 글꼴과 화면

오른쪽 위 '가가' 버튼을 누르면 글자 크기, 줄 간격, 여백, 글꼴, 배경을 바꿀 수 있어요. 글꼴은 바탕 계열 두 가지와 고딕 하나를 준비해 뒀어요.

글자를 키우면 한 쪽에 들어가는 글이 줄어서 쪽 수가 다시 계산돼요. 그래도 읽던 자리는 그대로예요. txt리더기는 몇 쪽인지가 아니라 몇 번째 글자인지로 위치를 기억하거든요. 휴대폰을 가로로 돌려도 마찬가지예요.

배경을 '자동'으로 두면 기기의 밝은 화면, 어두운 화면 설정을 따라가요. 불 끄고 읽을 때는 '밤'이 눈이 편하고, 낮에 오래 읽을 때는 '미색'이 종이 느낌에 가까워요.

제4장 목차와 책갈피

txt리더기는 짧은 한 줄짜리 제목을 찾아서 목차를 만들어요. '제1장', '제12화', '3부', 'Chapter 5', '프롤로그', '에필로그', '작가의 말' 같은 줄이 있으면 장 제목으로 봐요. 웹소설처럼 '12화'나 '- 12 -'만 따로 적힌 줄도 알아봐요. 이 안내서의 목차도 이렇게 만들어졌어요.

목차 버튼을 누르면 장 목록이 나오고, 하나를 고르면 그 장으로 넘어가요. 장 제목을 못 찾은 책은 목차 없이 처음부터 끝까지 이어서 보여 줘요.

리본 모양 버튼을 누르면 지금 쪽에 책갈피가 꽂혀요. 쪽 오른쪽 위에 파란 리본이 걸리면 된 거예요. 한 번 더 누르면 빠져요. 꽂아 둔 책갈피는 목차 버튼을 눌러 '책갈피' 칸에서 모아 볼 수 있어요.

읽던 자리는 쪽을 넘길 때마다 알아서 저장돼요. 서재에서 책을 다시 열면 마지막으로 보던 쪽부터 이어져요.

제5장 원고지 매수

서재에서 책마다 '원고지 약 ○○매'라고 적혀 있어요. 띄어쓰기까지 포함한 글자 수를 200자 원고지 한 장으로 나눈 값이에요. 줄바꿈과 문단 나눔은 따지지 않은 대략적인 숫자라서, 책이 얼마나 두꺼운지 가늠하는 정도로 보면 돼요.

이 안내서가 몇 매인지는 서재에서 확인해 보세요. 장편소설 파일을 넣어 보면 천 매를 훌쩍 넘는 경우가 많을 거예요.

에필로그

이제 서재를 열고 읽고 싶은 파일을 넣어 보세요. 휴대폰에서는 이 페이지를 홈 화면에 추가해 두면 앱처럼 아이콘을 눌러 바로 열 수 있어요.`;

/* ───────── 저장소 (이 브라우저의 IndexedDB) ───────── */
const Store = (() => {
  let db = null;
  const mem = { meta: new Map(), text: new Map() };
  const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function open() {
    try {
      if (!('indexedDB' in window)) return false;
      db = await Promise.race([
        new Promise((res, rej) => {
          const r = indexedDB.open('hanjang-reader', 1);
          r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', { keyPath: 'id' }); d.createObjectStore('text', { keyPath: 'id' }); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500))
      ]);
      for (const [k, m] of mem.meta) await put('meta', m);
      for (const [k, t] of mem.text) await put('text', t);
      return true;
    } catch (e) { db = null; return false; }
  }
  async function get(store, id) {
    if (db) { try { const v = await rq(db.transaction(store).objectStore(store).get(id)); if (v) return v; } catch (e) {} }
    return mem[store].get(id);
  }
  async function put(store, val) {
    if (db) {
      try { await rq(db.transaction(store, 'readwrite').objectStore(store).put(val)); mem[store].delete(val.id); return true; }
      catch (e) { mem[store].set(val.id, val); return false; }
    }
    mem[store].set(val.id, val); return false;
  }
  async function del(id) {
    mem.meta.delete(id); mem.text.delete(id);
    if (db) { try { const t = db.transaction(['meta', 'text'], 'readwrite'); t.objectStore('meta').delete(id); t.objectStore('text').delete(id); await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
  }
  async function all() {
    let list = [];
    if (db) { try { list = await rq(db.transaction('meta').objectStore('meta').getAll()); } catch (e) {} }
    const ids = new Set(list.map(m => m.id));
    for (const m of mem.meta.values()) if (!ids.has(m.id)) list.push(m);
    return list;
  }
  return { open, get, put, del, all, get ok() { return !!db; } };
})();

/* ───────── 글 읽기: 인코딩과 문단 ───────── */
function decode(buf) {
  const u8 = new Uint8Array(buf);
  try {
    if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
    if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  } catch (e) {}
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) {}
  try { return new TextDecoder('euc-kr').decode(buf); } catch (e) {}

async function fileToText(f) {
  const buf = await f.arrayBuffer();
  const u8 = new Uint8Array(buf, 0, Math.min(32, buf.byteLength));
  const ext = ((f.name.match(/\.([^.]+)$/) || ['', ''])[1] || '').toLowerCase();
  const head = String.fromCharCode(...u8);
  if (head.startsWith('%PDF')) {
    return fromPdf(buf, (i, n) => { if (n > 3) toast(`PDF 읽는 중 ${i}/${n}쪽`, 60000); });
  }
  if (u8[0] === 0x50 && u8[1] === 0x4B) return fromZip(buf, ext);
  if (u8[0] === 0xD0 && u8[1] === 0xCF && u8[2] === 0x11 && u8[3] === 0xE0) return fromHwp(buf);
  if (head.startsWith('HWP Document File')) throw new ReadError('한글 97 이전 형식이라 못 읽어요. 한글에서 hwpx로 저장해서 넣어 주세요.');
  if (['pdf', 'docx', 'hwpx', 'hwp'].includes(ext)) throw new ReadError(`${ext} 파일이 깨졌거나 형식이 달라요.`);

}

      toast(ext === 'doc' ? '옛날 워드(.doc)는 못 읽어요. 워드에서 docx로 저장해서 넣어 주세요.' : `${f.name}: 이 형식은 못 읽어요. txt, docx, hwp, hwpx, pdf만 돼요.`, 4500);

      const r = await addBook(f.name.replace(/\.[^.]+$/, ''), text);

}

  if (d < 3600) return `${Math.floor(d / 60)}분 전에 읽음`;
  if (d < 86400) return `${Math.floor(d / 3600)}시간 전에 읽음`;
  const days = Math.floor(d / 86400);

  if (days < 7) return `${days}일 전에 읽음`;

}

  if (tc) { const m = (bg || getComputedStyle(document.body).backgroundColor).match(/\d+/g); if (m) tc.content = '#' + m.slice(0, 3).map(v => (+v).toString(16).padStart(2, '0')).join(''); }
}
function syncSettings() {
  $('fsVal').textContent = S.size;
  document.querySelectorAll('[data-key]').forEach(g => {
    const k = g.dataset.key;
    g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(String(S[k]) === b.dataset.v)));
  });
  $('spreadSw').setAttribute('aria-checked', String(!!S.spread));
  $('motionSw').setAttribute('aria-checked', String(!!S.motion));
}
function changed() { saveS(); applySettings(); syncSettings(); reflow(); }
document.querySelectorAll('[data-key]').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = g.dataset.key; S[k] = k === 'lh' ? parseFloat(b.dataset.v) : b.dataset.v; changed();
}));
$('fsDown').addEventListener('click', () => { S.size = clamp(S.size - 1, 13, 34); changed(); });
$('fsUp').addEventListener('click', () => { S.size = clamp(S.size + 1, 13, 34); changed(); });
$('spreadSw').addEventListener('click', () => { S.spread = !S.spread; changed(); });
$('motionSw').addEventListener('click', () => { S.motion = !S.motion; changed(); });

/* ───────── 진행 막대 ───────── */
function scrubPos() { const v = +scrub.value; return v <= 0 ? -1 : Math.floor(v / 1000 * book.len); }
scrub.addEventListener('input', () => {
  if (!book) return;
  scrubbing = true;
  scrub.style.setProperty('--p', (scrub.value / 10) + '%');
  const p = scrubPos(); const ci = chapAt(p);
  info.classList.add('preview');
  infoCh.textContent = ci >= 0 ? book.chaps[ci].t : book.meta.title;
  infoPct.textContent = `${Math.round(scrub.value / 10)}%로 이동`;
});
scrub.addEventListener('change', () => { if (!book) return; scrubbing = false; jumpTo(scrubPos(), true); });

/* ───────── 손가락·마우스·키보드 ───────── */
let pd = null;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !book) return;
  pd = { x: e.clientX, y: e.clientY, id: e.pointerId, drag: false };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  keepAwake();
});
stage.addEventListener('pointermove', e => {
  if (!pd || e.pointerId !== pd.id) return;
  const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
  if (!pd.drag && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) pd.drag = true;
  if (pd.drag) {
    flow.style.transition = 'none';
    flow.style.transform = `translate3d(${-cur.page * geo.stride + dx * 0.85}px,0,0)`;
  }
});
stage.addEventListener('pointerup', e => {
  if (!pd || e.pointerId !== pd.id) return;
  const dx = e.clientX - pd.x, dy = e.clientY - pd.y, drag = pd.drag; pd = null;
  if (drag) {
    if (Math.abs(dx) > 50) { const moved = dx < 0 ? next() : prev(); if (!moved) show(true); }
    else show(true);
    return;
  }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    const r = stage.getBoundingClientRect(); const fx = (e.clientX - r.left) / r.width;
    if (fx < 1 / 3) prev(); else if (fx > 2 / 3) next(); else setChrome(!reader.classList.contains('chrome'));
  }
});
stage.addEventListener('pointercancel', () => { if (pd && pd.drag) show(true); pd = null; });
let lastWheel = 0;
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) < 3) return;
  const now = performance.now(); const fresh = now - lastWheel > 260; lastWheel = now;
  if (fresh) d > 0 ? next() : prev();
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (anyOpen()) closeAll(); return; }
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (anyOpen() || !book) return;
  if (e.key === ' ' && e.target.closest && e.target.closest('button, label')) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); prev(); }
});

/* 화면 켜 두기 (브라우저가 허락할 때만) */
let wl = null;
async function keepAwake() {
  try { if (!wl && navigator.wakeLock && document.visibilityState === 'visible') { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {}
}

/* ───────── 알림 ───────── */
let tT = 0;
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), ms || 2200);
}

/* ───────── 크기 변화·글꼴 로딩 ───────── */
let rT = 0; const debReflow = () => { clearTimeout(rT); rT = setTimeout(reflow, 140); };
let lastSize = '';
if ('ResizeObserver' in window) new ResizeObserver(() => { const r = stage.getBoundingClientRect(); const k = Math.round(r.width) + 'x' + Math.round(r.height); if (k !== lastSize) { lastSize = k; debReflow(); } }).observe(stage);
else window.addEventListener('resize', debReflow);
if (document.fonts) { document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', debReflow); document.fonts.ready.then(debReflow); }

/* ───────── 시작 ───────── */
let lastId = null; try { lastId = localStorage.getItem('hanjang.last'); } catch (e) {}
reader.style.setProperty('--top-gap', TOP_GAP + 'px');
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings); } catch (e) {}
applySettings(); syncSettings(); setChrome(true);
loadBook(guideMeta(), GUIDE_TEXT);
(async () => {
  await Store.open();
  let g = await Store.get('meta', GUIDE_ID);
  await Store.put('text', { id: GUIDE_ID, text: GUIDE_TEXT });
  if (!g) { g = book.meta; await Store.put('meta', g); }
  else { g.title = GUIDE_TITLE; g.len = GUIDE_TEXT.length; g.chars = guideMeta().chars; }
  booted = true;
  if (lastId && lastId !== GUIDE_ID && await openBook(lastId)) { /* 마지막으로 읽던 책을 이어서 펼침 */ }
  else if (g !== book.meta) loadBook(g, GUIDE_TEXT);
  renderLibrary();
})();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
</script>
